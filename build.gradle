plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'ru.gavrdmg'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def junitVersion = "5.14.3",
    slf4jVersion = "2.0.17",
    datafakerVersion = "2.5.4",
    assertjVersion = "3.27.7",
    selenideVersion = "7.18.2",
    allureVersion = "2.32.0"
allure {
    report {
        version.set(allureVersion)
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set(allureVersion) //версия интеграции фреймворка и Allure
            }
        }
    }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation(

            "net.datafaker:datafaker:$datafakerVersion",
            "org.assertj:assertj-core:$assertjVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion",
            "com.codeborne:selenide:$selenideVersion",
            "org.aeonbits.owner:owner:1.0.4",
            "commons-io:commons-io:2.11.0",

    )
}

test {
    useJUnitPlatform()

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
    systemProperties(System.getProperties())
    systemProperty 'file.encoding', 'UTF-8'
}
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }